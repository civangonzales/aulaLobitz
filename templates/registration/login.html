{% load static %}<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión · aulaLobitz</title><link rel="stylesheet" href="{% static 'app.css' %}"></head><body class="login-page"><form class="login-card" method="post">{% csrf_token %}<a class="brand" href="#"><b>A</b><span>aula<strong>Lobitz</strong></span></a><div class="eyebrow">TU ESPACIO DE ESTUDIO</div><h1>Bienvenido</h1><p>Ingresa para continuar tu aprendizaje.</p>{% if form.errors %}<div class="message error">Correo o contraseña incorrectos.</div>{% endif %}<label>Correo electrónico<input name="username" type="email" required autofocus></label><label>Contraseña<input name="password" type="password" required></label><button class="button primary full">Iniciar sesión</button><p style="margin-top:18px"><a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a></p></form></body></html>
