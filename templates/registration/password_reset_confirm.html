{% extends 'registration/auth_base.html' %}
{% block content %}<h1>Elige una nueva contraseña</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="button primary full" type="submit">Guardar contraseña</button></form>{% else %}<p>El enlace ya se usó o ha caducado.</p><a class="button" href="{% url 'password_reset' %}">Solicitar otro enlace</a>{% endif %}{% endblock %}
