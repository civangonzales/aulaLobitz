{% extends 'registration/auth_base.html' %}
{% block content %}<h1>Recuperar contraseña</h1><p>Escribe el correo con el que accedes a aulaLobitz. Te enviaremos un enlace para elegir una nueva contraseña.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="button primary full" type="submit">Enviar enlace</button></form>
<p><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>{% endblock %}
